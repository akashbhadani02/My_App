<!DOCTYPE html>
<html lang="en">

<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#506ef0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:450px;
height:450px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-150px;
left:-120px;
filter:blur(20px);
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:rgba(255,255,255,.06);
border-radius:50%;
bottom:-120px;
right:-100px;
filter:blur(20px);
}

.login-box{
position:relative;
width:380px;
padding:40px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.2);
border-radius:20px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
z-index:2;
animation:fadeIn .8s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{
  width:92px!important;
  height:92px!important;
  margin:0 auto 15px auto!important;
  border-radius:24px!important;
  background:#fff!important;
  padding:5px!important;
  overflow:hidden!important;
  display:grid!important;
  place-items:center!important;
  box-shadow:0 12px 30px rgba(79,70,229,.22);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:18px;
  display:block;
}

h2{
text-align:center;
color:#fff;
margin-bottom:30px;
font-size:30px;
letter-spacing:1px;
}

input{
width:100%;
padding:15px;
margin-bottom:18px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:#fff;
font-size:16px;
transition:.3s;
}

input::placeholder{
color:#ddd;
}

input:focus{
background:rgba(255,255,255,.22);
box-shadow:0 0 12px #60a5fa;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#2563eb,#3b82f6);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
background:linear-gradient(90deg,#1d4ed8,#2563eb);
box-shadow:0 10px 25px rgba(37,99,235,.45);
}

.login-btn{
width:100%;
background:linear-gradient(90deg,#2563eb,#3b82f6)!important;
color:#fff!important;
}
.install-btn{
width:100%;
margin-top:12px;
padding:14px 15px;
border:1px solid rgba(34,197,94,.45)!important;
border-radius:12px;
background:linear-gradient(90deg,#16a34a,#22c55e)!important;
color:#fff!important;
font-size:16px;
font-weight:800;
cursor:pointer;
box-shadow:0 8px 20px rgba(22,163,74,.25);
}
.install-btn:hover{
background:linear-gradient(90deg,#15803d,#16a34a)!important;
box-shadow:0 10px 24px rgba(22,163,74,.4);
}
.install-btn:active{transform:scale(.98)}

.footer{
margin-top:20px;
text-align:center;
color:#ddd;
font-size:14px;
}

@media(max-width:450px){

.login-box{
width:90%;
padding:30px 20px;
}

h2{
font-size:25px;
}

.logo{
font-size:55px;
}

}
</style>
<style id="aducate-admin-login-logo-style">
.logo{
  align-items: center;
  text-align: center;
  justify-content: center;
  width:92px!important;height:92px!important;
  border-radius:24px!important;
  background:#fff!important;
  padding:5px!important;
  overflow:hidden!important;
  display:grid!important;
  place-items:center!important;
  box-shadow:0 12px 30px rgba(79,70,229,.22)
}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
</style>

<style>
/* ===== FINAL RESPONSIVE PASS ===== */
*,*::before,*::after{box-sizing:border-box}
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:hidden}
img,video,canvas,svg{max-width:100%;height:auto}
button,input,select,textarea{max-width:100%;font:inherit}
button{touch-action:manipulation}

/* App screens: no accidental horizontal scrolling */
#dashboard,#quiz,#activities,#activityPlay{max-width:100vw;overflow-x:hidden}

/* Quiz: app-like full viewport on every device */
#quiz.kbc-quiz-screen{
  width:100%;max-width:none;height:100dvh;min-height:100dvh;
  max-height:none;margin:0;padding:clamp(10px,2vw,28px);
  overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.kbc-shell{width:min(1180px,100%);min-height:calc(100dvh - 2 * clamp(10px,2vw,28px));}
.kbc-question-wrap,.kbc-lifelines{width:min(980px,100%)}
#quiz.kbc-quiz-screen #question{overflow-wrap:anywhere;word-break:normal}
#quiz.kbc-quiz-screen .option-btn{overflow-wrap:anywhere;word-break:normal}

/* Tablet */
@media (min-width:701px) and (max-width:1100px){
  #quiz.kbc-quiz-screen{padding:18px}
  .kbc-shell{min-height:calc(100dvh - 36px)}
  #quiz.kbc-quiz-screen #question{font-size:clamp(18px,2.5vw,25px)}
  #quiz.kbc-quiz-screen .option-btn{font-size:15px;min-height:64px}
}

/* Mobile */
@media (max-width:700px){
  body{overflow-x:hidden}
  #quiz.kbc-quiz-screen{
    position:fixed;inset:0;z-index:99990;
    width:100vw;height:100dvh;min-height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  }
  .kbc-shell{min-height:calc(100dvh - max(18px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));gap:0}
  .kbc-topbar{gap:7px;flex-wrap:nowrap}
  .kbc-brand{min-width:0;flex:1}
  .kbc-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbc-balance{flex-shrink:0}
  .kbc-question-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
  #quiz.kbc-quiz-screen #question{font-size:clamp(17px,4.8vw,21px);line-height:1.38;min-height:118px;padding:18px 15px;margin-bottom:12px}
  #quiz.kbc-quiz-screen #options{grid-template-columns:1fr;gap:9px}
  #quiz.kbc-quiz-screen .option-btn{font-size:clamp(13px,3.6vw,16px);min-height:56px;padding:10px 12px 10px 49px}
  .kbc-lifelines{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:8px}
  .kbc-lifeline{min-height:48px;padding:7px 5px;font-size:10px}
  .kbc-footer{margin-top:9px;padding-bottom:2px}
  .kbc-tip{max-width:68%;font-size:9px}
  #quiz.kbc-quiz-screen .kbc-back{min-height:38px;padding:7px 12px}
  .kbc-poll{max-height:150px;overflow:auto}
}
@media (max-width:390px){
  #quiz.kbc-quiz-screen{padding-top:max(5px,env(safe-area-inset-top));padding-left:6px;padding-right:6px}
  .kbc-orb{width:32px;height:32px}
  .kbc-brand{font-size:12px}
  .kbc-balance{font-size:10px;padding:6px 8px}
  .kbc-progress{margin:1px auto 7px}
  #quiz.kbc-quiz-screen #question{font-size:16px;min-height:104px;padding:15px 12px}
  #quiz.kbc-quiz-screen .option-btn{font-size:12px;min-height:52px;padding-left:46px}
  .kbc-lifeline{min-height:44px;font-size:9px}
  .kbc-lifeline span{font-size:8px}
}

/* Dashboard responsive grids */
@media (max-width:780px){
  #dashboard{width:100%!important;max-width:100%!important;min-height:100dvh!important}
  .dashboard-topbar,.ad-topbar,.ad-main,.ad-welcome,.wallet-box,.dashboard-actions,.activity-grid,.ad-grid,.ad-course-grid{max-width:100%;}
  .dashboard-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .ad-grid,.ad-course-grid{grid-template-columns:1fr!important}
  .ad-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .wallet-box{padding:20px 16px}
  #dashboard h2{font-size:clamp(21px,6vw,27px);line-height:1.2}
  .ad-action,.ad-course,.activity-btn{min-width:0;overflow:hidden}
  .ad-action *, .ad-course *, .activity-btn *{max-width:100%;overflow-wrap:anywhere}
}
@media (max-width:480px){
  .dashboard-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  .ad-stats{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .ad-action{padding:12px 8px!important;min-height:76px!important}
  .ad-action-title{font-size:12px!important}
  .ad-action-sub{font-size:10px!important}
  .activity-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  .activity-btn{padding:12px 7px!important;font-size:12px!important}
  .ad-days{overflow-x:auto!important;grid-template-columns:repeat(10,minmax(34px,1fr))!important;padding-bottom:4px}
}
@media (max-width:350px){
  .dashboard-actions,.activity-grid{grid-template-columns:1fr!important}
  .ad-stats{grid-template-columns:1fr 1fr!important}
}

/* Modals and popups */
@media(max-width:700px){
  .book-modal{padding:5px!important}
  .book-box{max-height:94dvh;overflow:auto;padding:18px 14px}
  .modal,.popup,.activity-popup-card{max-width:calc(100vw - 12px)!important}
}

/* Login / profile pages: prevent fixed desktop widths */
@media(max-width:700px){
  .login-card,.auth-card,.profile-card,.container,.main-card{width:calc(100% - 20px)!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important}
  input,select,textarea{min-width:0!important}
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo"><img src="/icon-192.png" alt="Aducate Logo"></div>

<h2>Admin Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button class="login-btn" onclick="login()">Login</button>

<button id="aducate-install-app" class="install-btn" type="button">📲 Install Aducate App</button>

<div class="footer">
Secure Admin Panel
</div>

</div>

<script>

async function login(){

const res = await fetch("/api/admin/login",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:username.value,

password:password.value

})

});

const data = await res.json();

if(data.success){

localStorage.setItem("adminToken",data.token);

location.href="admin.html";

}else{

alert(data.message);

}

}

</script>


<script>
(function(){
  let deferredPrompt=null;
  const btn=document.getElementById('aducate-install-app');
  if(!btn) return;

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    btn.style.display='block';
  });

  btn.addEventListener('click',async function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
    }else{
      alert('જો Install popup ન આવે તો Chrome/Edge ના menu (⋮) માંથી “Install Aducate English App” પસંદ કરો.');
    }
  });

  window.addEventListener('appinstalled',()=>{
    deferredPrompt=null;
    btn.style.display='none';
  });

  window.addEventListener('load',()=>{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(console.error);
    }
    if(window.matchMedia('(display-mode: standalone)').matches){
      btn.style.display='none';
    }
  });
})();
</script>
</body>

</html>
