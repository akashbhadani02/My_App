<div class="login-box">

<div class="logo"><img src="/icon-192.png" alt="Aducate English logo"></div><div class="admin-brand-name">Aducate English</div>

<h2>Admin Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button class="login-btn" onclick="login()">Login</button>

<button id="aducate-install-app" class="install-btn" type="button">📲 Install Aducate English App</button>

Aducate English · Secure Admin Panel

<script>

async function login(){

const res = await fetch("/api/admin/login",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:username.value,

password:password.value

})

});

const data = await res.json();

if(data.success){

localStorage.setItem("adminToken",data.token);

location.href="admin.html";

}else{

alert(data.message);

}

}

</script>


<script>
(function(){
  let deferredPrompt=null;
  const btn=document.getElementById('aducate-install-app');
  if(!btn) return;

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    btn.style.display='block';
  });

  btn.addEventListener('click',async function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
    }else{
      alert('જો Install popup ન આવે તો Chrome/Edge ના menu (⋮) માંથી “Install Aducate English App” પસંદ કરો.');
    }
  });

  window.addEventListener('appinstalled',()=>{
    deferredPrompt=null;
    btn.style.display='none';
  });

  window.addEventListener('load',()=>{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(console.error);
    }
    if(window.matchMedia('(display-mode: standalone)').matches){
      btn.style.display='none';
    }
  });
})();
</script>
