    <div class="coach-hero-copy"><h1>તમારો Free English Grammar Coach</h1>

    </div>

<script>
const $ = id => document.getElementById(id);
const sampleText = "Yesterday I go to market and buyed some fruits.";
$("sample").addEventListener("click", () => { $("message").value = sampleText; $("message").focus(); });
$("clear").addEventListener("click", () => { $("message").value=""; $("status").textContent=""; $("status").classList.remove("error"); $("answerPanel").hidden=true; });

// Browser-only, rule-based English checker. No API calls and no external server.
function checkEnglish(input) {
  let text = input.trim().replace(/\s+/g, " ");
  const notes = [];
  const apply = (pattern, replacement, explanation) => {
    const next = text.replace(pattern, replacement);
    if (next !== text) { text = next; if (!notes.includes(explanation)) notes.push(explanation); }
  };
  // Common fixed expressions and high-confidence grammar errors.
  apply(/\bI am agree\b/gi, "I agree", "‘Agree’ ક્રિયાપદ છે, તેથી ‘I am agree’ નહીં, ‘I agree’ કહો.");
  apply(/\bI am understand\b/gi, "I understand", "‘Understand’ ક્રિયાપદ છે: ‘I understand’ કહો.");
  apply(/\bI am know\b/gi, "I know", "‘Know’ ક્રિયાપદ છે: ‘I know’ કહો.");
  apply(/\bI am having\s+(?=(?:a|an|the|one|two|three)\b)/gi, "I have ", "માલિકી બતાવવા સામાન્ય રીતે ‘I have’ વાપરો.");
  apply(/\bdiscuss about\b/gi, "discuss", "‘Discuss’ પછી સીધો વિષય આવે છે; ‘about’ની જરૂર નથી.");
  apply(/\breturn back\b/gi, "return", "‘Return’માં પાછા જવાનો અર્થ પહેલેથી છે; ‘back’ સામાન્ય રીતે જરૂરી નથી.");
  apply(/\bmore better\b/gi, "better", "‘Better’ પોતે જ comparative છે; ‘more better’ નહીં.");
  apply(/\bmost easiest\b/gi, "easiest", "‘Easiest’ superlative છે; ‘most easiest’ નહીં.");
  apply(/\b(one of the)\s+([a-z]+)\b/gi, (m,a,n) => a+" "+(n.endsWith("s")?n:n+"s"), "‘One of the’ પછી સામાન્ય રીતે plural noun આવે છે.");
  apply(/\b(he|she|it)\s+don't\b/gi, "$1 doesn't", "He/She/It સાથે present simpleમાં ‘doesn't’ વાપરો.");
  apply(/\b(I|you|we|they)\s+doesn't\b/gi, "$1 don't", "I/You/We/They સાથે ‘don't’ વાપરો.");
  apply(/\b(he|she|it)\s+don't\s+have\b/gi, "$1 doesn't have", "He/She/It સાથે ‘doesn't have’ વાપરો.");
  apply(/\b(he|she|it)\s+are\b/gi, "$1 is", "He/She/It સાથે ‘is’ વાપરો.");
  apply(/\b(I)\s+is\b/gi, "$1 am", "‘I’ સાથે ‘am’ વાપરો.");
  apply(/\b(you|we|they)\s+is\b/gi, "$1 are", "You/We/They સાથે ‘are’ વાપરો.");
  apply(/\b(he|she|it)\s+have\b/gi, "$1 has", "He/She/It સાથે present simpleમાં ‘has’ વાપરો.");
  apply(/\b(he|she|it)\s+go\b/gi, "$1 goes", "He/She/It સાથે present simpleમાં verbને સામાન્ય રીતે -s/-es મળે છે.");
  apply(/\b(he|she|it)\s+do\b/gi, "$1 does", "He/She/It સાથે present simpleમાં ‘does’ વાપરો.");
  apply(/\b(he|she|it)\s+watch\b/gi, "$1 watches", "He/She/It સાથે ‘watch’નું રૂપ ‘watches’ થાય છે.");
  apply(/\b(he|she|it)\s+study\b/gi, "$1 studies", "He/She/It સાથે consonant + y હોય તો y બદલી -ies થાય છે.");
  apply(/\b(he|she|it)\s+play\b/gi, "$1 plays", "He/She/It સાથે ‘play’નું રૂપ ‘plays’ થાય છે.");
  apply(/\b(he|she|it)\s+like\b/gi, "$1 likes", "He/She/It સાથે present simpleમાં ‘likes’ વાપરો.");
  apply(/\b(he|she|it)\s+want\b/gi, "$1 wants", "He/She/It સાથે present simpleમાં ‘wants’ વાપરો.");
  apply(/\b(he|she|it)\s+need\b/gi, "$1 needs", "He/She/It સાથે present simpleમાં ‘needs’ વાપરો.");
  apply(/\b(he|she|it)\s+eat\b/gi, "$1 eats", "He/She/It સાથે present simpleમાં ‘eats’ વાપરો.");
  apply(/\b(he|she|it)\s+work\b/gi, "$1 works", "He/She/It સાથે present simpleમાં ‘works’ વાપરો.");
  apply(/\b(he|she|it)\s+come\b/gi, "$1 comes", "He/She/It સાથે present simpleમાં ‘comes’ વાપરો.");
  apply(/\b(he|she|it)\s+know\b/gi, "$1 knows", "He/She/It સાથે present simpleમાં ‘knows’ વાપરો.");
  apply(/\b(he|she|it)\s+say\b/gi, "$1 says", "He/She/It સાથે present simpleમાં ‘says’ વાપરો.");
  apply(/\b(he|she|it)\s+try\b/gi, "$1 tries", "He/She/It સાથે ‘try’નું રૂપ ‘tries’ થાય છે.");
  apply(/\b(he|she|it)\s+teach\b/gi, "$1 teaches", "He/She/It સાથે ‘teach’નું રૂપ ‘teaches’ થાય છે.");
  apply(/\b(he|she|it)\s+goes to home\b/gi, "$1 goes home", "‘Home’ પહેલાં સામાન્ય રીતે ‘to’ વપરાતું નથી.");
  apply(/\b(go|went|come|came) to home\b/gi, "$1 home", "‘Home’ પહેલાં સામાન્ય રીતે ‘to’ વપરાતું નથી.");
  apply(/\b(a)\s+([aeiou][a-z]*)\b/gi, "an $2", "સ્વરધ્વનિથી શરૂ થતા શબ્દ પહેલાં સામાન્ય રીતે ‘an’ આવે છે (કેટલાક અપવાદ છે).");
  apply(/\ban\s+([bcdfghjklmnpqrstvwxyz][a-z]*)\b/gi, "a $1", "વ્યંજનધ્વનિથી શરૂ થતા શબ્દ પહેલાં સામાન્ય રીતે ‘a’ આવે છે (કેટલાક અપવાદ છે).");
  apply(/\b(yesterday|last night|last week|last month|two days ago)\s+I\s+go\b/gi, "$1 I went", "ભૂતકાળ દર્શાવતા શબ્દ સાથે ‘go’નું past tense ‘went’ છે.");
  apply(/\b(yesterday|last night|last week|last month|two days ago)\s+I\s+buyed\b/gi, "$1 I bought", "‘Buy’નું past tense ‘bought’ છે, ‘buyed’ નહીં.");
  apply(/\bbuyed\b/gi, "bought", "‘Buy’નું past tense ‘bought’ છે, ‘buyed’ નહીં.");
  apply(/\bgoed\b/gi, "went", "‘Go’નું past tense ‘went’ છે.");
  apply(/\bcomed\b/gi, "came", "‘Come’નું past tense ‘came’ છે.");
  apply(/\bI didn't went\b/gi, "I didn't go", "‘Didn't’ પછી verbનું base form આવે છે: ‘didn't go’.");
  apply(/\b(didn't|did not)\s+(went|ate|saw|bought|came|had|made|took|gave|spoke|wrote)\b/gi, (m,aux,verb) => aux+" "+({went:"go",ate:"eat",saw:"see",bought:"buy",came:"come",had:"have",made:"make",took:"take",gave:"give",spoke:"speak",wrote:"write"}[verb.toLowerCase()]), "‘Didn't’ પછી past tense નહીં, verbનું base form વાપરો.");
  apply(/\b(am|is|are)\s+go\b/gi, "$1 going", "હમણાં ચાલી રહેલી ક્રિયા માટે ‘am/is/are + verb-ing’ વાપરો.");
  apply(/\b(am|is|are)\s+eat\b/gi, "$1 eating", "હમણાં ચાલી રહેલી ક્રિયા માટે ‘eating’ વાપરો.");
  apply(/\b(am|is|are)\s+play\b/gi, "$1 playing", "હમણાં ચાલી રહેલી ક્રિયા માટે ‘playing’ વાપરો.");
  apply(/\b(am|is|are)\s+work\b/gi, "$1 working", "હમણાં ચાલી રહેલી ક્રિયા માટે ‘working’ વાપરો.");
  apply(/\b(am|is|are)\s+study\b/gi, "$1 studying", "હમણાં ચાલી રહેલી ક્રિયા માટે ‘studying’ વાપરો.");
  apply(/\b(i)\b/g, "I", "અંગ્રેજીમાં ‘I’ હંમેશા capital લખાય છે.");
  // Basic punctuation and spacing.
  text = text.replace(/\s+([,.!?;:])/g, "$1").replace(/([,.!?;:])(?=\S)/g, "$1 ").replace(/\s{2,}/g," ").trim();
  text = text.replace(/(^|[.!?]\s+)([a-z])/g, (m,p,c)=>p+c.toUpperCase());
  if (text && !/[.!?]$/.test(text)) text += ".";
  return { corrected:text, notes };
}
function makeFeedback(message) {
  const result = checkEnglish(message);
  const unchanged = result.corrected.toLowerCase() === message.trim().replace(/\s+/g," ").replace(/[.!?]$/,".").toLowerCase();
  const lines = ["1. Corrected English", result.corrected, "", "2. Grammar feedback"];
  if (result.notes.length) lines.push(...result.notes.slice(0,8).map((n,i)=>(i+1)+". "+n));
  else lines.push("ચોક્કસ ભૂલ આ checkerના નિયમોમાં મળી નથી. વાક્ય યોગ્ય હોઈ શકે છે, પણ આ સંપૂર્ણ grammar checker નથી.");
  lines.push("", "3. Practice tip", "સુધારેલું વાક્ય ઊંચે અવાજે 3 વાર બોલો. પછી એ જ grammar ruleથી પોતાનું નવું વાક્ય બનાવો.");
  lines.push("", "4. Your next speaking question", "Can you write one more sentence about your day?");
  return lines.join("\n");
}
$("send").addEventListener("click", () => {
  const message = $("message").value.trim();
  $("status").classList.remove("error");
  if (!message) { $("status").textContent = "કૃપા કરીને પહેલાં અંગ્રેજીમાં એક કે વધુ વાક્યો લખો."; $("message").focus(); return; }
  if (message.length > 2500) { $("status").textContent = "કૃપા કરીને 2,500 charactersથી ટૂંકું લખો."; return; }
  $("send").disabled = true; $("status").textContent = "તમારું વાક્ય browserમાં તપાસી રહ્યા છીએ…"; $("answerPanel").hidden = true;
  try {
    const feedback = makeFeedback(message);
    $("answer").textContent = feedback;
    $("answerPanel").hidden = false;
    $("status").textContent = "Grammar check પૂરું થયું. નોંધ: આ rule-based checker છે, સંપૂર્ણ AI નથી.";
  } catch (e) { $("status").textContent = "વાક્ય તપાસી શકાયું નહીં. ફરી પ્રયાસ કરો."; $("status").classList.add("error"); }
  finally { $("send").disabled = false; }
});
